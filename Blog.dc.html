<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.gated = new Map();
    this.observer = null;
    this.noiseRef = (el) => { if (el && !el.dataset.drawn) { el.dataset.drawn = '1'; this.startNoise(el); } };
    this.fernLeftRef = (el) => this.registerGated(el, 'fern');
    this.fernRightRef = (el) => this.registerGated(el, 'fern');
    this.intervals = [];
  }
  registerGated(el, kind) {
    if (!el || el.dataset.gated) return;
    el.dataset.gated = '1';
    this.gated.set(el, { kind, running: false, stop: null });
    if (!this.observer) {
      this.observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          const info = this.gated.get(entry.target);
          if (!info) return;
          if (entry.isIntersecting && !info.running) {
            info.running = true;
            info.stop = this.startGated(entry.target, info.kind);
          } else if (!entry.isIntersecting && info.running) {
            info.running = false;
            if (info.stop) info.stop();
            info.stop = null;
          }
        });
      }, { rootMargin: '200px' });
    }
    this.observer.observe(el);
  }
  startGated(el, kind) {
    const color = el.dataset.color;
    if (kind === 'fern') return this.startFern(el, color || 'rgba(30,60,36,0.5)');
  }
  trackInterval(id) {
    this.intervals.push(id);
    return () => { clearInterval(id); this.intervals = this.intervals.filter(i => i !== id); };
  }
  componentWillUnmount() {
    this.intervals.forEach(clearInterval);
    if (this.observer) this.observer.disconnect();
  }
  startFern(canvas, color) {
    const w = Math.max(20, Math.round(canvas.clientWidth || 64));
    const h = Math.max(200, Math.round(canvas.clientHeight || 800));
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    const maxPoints = 2600;
    const batch = 4;
    let slots = [];
    const usedY = [];
    const spacing = 150;
    const maxSlots = Math.max(3, Math.floor(h / spacing));
    let nextY = 60;
    const spawnSlot = () => {
      if (slots.length >= maxSlots) return false;
      const anchorY = Math.min(h - 40, nextY);
      nextY += spacing;
      const fernScale = 9 + Math.random() * 4;
      const flip = Math.random() < 0.5 ? -1 : 1;
      const anchorX = w / 2 + (Math.random() * 8 - 4);
      slots.push({ x: 0, y: 0, n: 0, anchorX, anchorY, fernScale, flip, done: false });
      return true;
    };
    while (spawnSlot()) {}
    const step = () => {
      const activeList = slots.filter(s => !s.done);
      if (!activeList.length) return;
      for (const active of activeList) {
        const toPx = (fx, fy) => [active.anchorX + fx * active.fernScale * active.flip, active.anchorY - fy * active.fernScale];
        for (let i = 0; i < batch && active.n < maxPoints; i++, active.n++) {
          const r = Math.random();
          let nx, ny;
          if (r < 0.01) { nx = 0; ny = 0.16 * active.y; }
          else if (r < 0.86) { nx = 0.85 * active.x + 0.04 * active.y; ny = -0.04 * active.x + 0.85 * active.y + 1.6; }
          else if (r < 0.93) { nx = 0.2 * active.x - 0.26 * active.y; ny = 0.23 * active.x + 0.22 * active.y + 1.6; }
          else { nx = -0.15 * active.x + 0.28 * active.y; ny = 0.26 * active.x + 0.24 * active.y + 0.44; }
          active.x = nx; active.y = ny;
          const [px, py] = toPx(active.x, active.y);
          ctx.fillStyle = color;
          ctx.fillRect(px, py, 1.2, 1.2);
        }
        if (active.n >= maxPoints) active.done = true;
      }
    };
    const id = setInterval(step, 45);
    return this.trackInterval(id);
  }
  startNoise(canvas) {
    const w = Math.max(1, Math.round(canvas.clientWidth || 1000));
    const h = Math.max(1, Math.round(canvas.clientHeight || 1000));
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    const img = ctx.createImageData(w, h);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = 245 + Math.floor(Math.random() * 10 - 5);
      img.data[i] = v; img.data[i+1] = v; img.data[i+2] = v; img.data[i+3] = 8;
    }
    ctx.putImageData(img, 0, 0);
  }
  renderVals() {
    return { noiseRef: this.noiseRef, fernLeftRef: this.fernLeftRef, fernRightRef: this.fernRightRef };
  }
}

</script>
