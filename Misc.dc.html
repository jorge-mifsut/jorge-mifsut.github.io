<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.intervals = [];
    this.noiseRef = (el) => { if (el && !el.dataset.drawn) { el.dataset.drawn = '1'; this.startNoise(el); } };
    this.fractalRef = (el) => { if (el && !el.dataset.drawn) { el.dataset.drawn = '1'; this.startFractal(el); } };
  }
  componentWillUnmount() {
    this.intervals.forEach(clearInterval);
  }
  startFractal(canvas, colorCsv) {
    const stops = [[45, 90, 160], [140, 60, 150], [217, 154, 43], [200, 70, 55]];
    const colorAt = (t) => {
      const n = stops.length - 1;
      const seg = Math.min(n - 1, Math.floor(t * n));
      const lt = t * n - seg;
      const a = stops[seg], b2 = stops[seg + 1];
      return [a[0] + (b2[0] - a[0]) * lt, a[1] + (b2[1] - a[1]) * lt, a[2] + (b2[2] - a[2]) * lt];
    };
    const w = Math.max(400, Math.round((canvas.clientWidth || 900) * 0.8));
    const h = Math.max(400, Math.round((canvas.clientHeight || 1200) * 0.8));
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    const img = ctx.createImageData(w, h);
    const maxIter = 48;
    let cx, cy, offX, offY, zoom;
    const iterAt = (x, y) => {
      let iter = 0;
      while (x * x + y * y < 4 && iter < maxIter) {
        const xt = x * x - y * y + cx;
        y = 2 * x * y + cy;
        x = xt;
        iter++;
      }
      return iter;
    };
    const escapeFrac = () => {
      let escaped = 0, samples = 36;
      for (let i = 0; i < samples; i++) {
        let x = (Math.random() - 0.5) / zoom + offX;
        let y = (Math.random() - 0.5) / zoom + offY;
        if (iterAt(x, y) < maxIter) escaped++;
      }
      return escaped / samples;
    };
    const reseed = () => {
      zoom = 1.3;
      cx = -0.75 + (Math.random() - 0.5) * 0.5;
      cy = 0.13 + (Math.random() - 0.5) * 0.5;
      let best = null, bestScore = -Infinity;
      for (let i = 0; i < 260; i++) {
        const x = (Math.random() - 0.5) * 3;
        const y = (Math.random() - 0.5) * 3;
        const it = iterAt(x, y);
        const score = -Math.abs(it - maxIter * 0.55);
        if (score > bestScore) { bestScore = score; best = [x, y]; }
      }
      offX = best[0]; offY = best[1];
    };
    reseed();
    const render = () => {
      const aspect = w / h;
      for (let py = 0; py < h; py++) {
        for (let px = 0; px < w; px++) {
          let x = ((px / w - 0.5) * aspect) / zoom + offX;
          let y = (py / h - 0.5) / zoom + offY;
          let iter = 0;
          while (x * x + y * y < 4 && iter < maxIter) {
            const xt = x * x - y * y + cx;
            y = 2 * x * y + cy;
            x = xt;
            iter++;
          }
          const idx = (py * w + px) * 4;
          const t = iter / maxIter;
          const a = iter === maxIter ? 0 : Math.pow(1 - t, 1.5) * 235;
          const [cr, cg, cb] = colorAt(t);
          img.data[idx] = cr; img.data[idx + 1] = cg; img.data[idx + 2] = cb; img.data[idx + 3] = a;
        }
      }
      ctx.putImageData(img, 0, 0);
    };
    render();
    const id = setInterval(() => {
      zoom *= 1.025;
      const f = escapeFrac();
      if (zoom > 60 || f < 0.06 || f > 0.94) reseed();
      render();
    }, 120);
    this.intervals.push(id);
  }
  startNoise(canvas) {
    const w = Math.max(1, Math.round(canvas.clientWidth || 1000));
    const h = Math.max(1, Math.round(canvas.clientHeight || 1000));
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    const img = ctx.createImageData(w, h);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = 240 + Math.floor(Math.random() * 12 - 6);
      img.data[i] = v; img.data[i+1] = v; img.data[i+2] = v; img.data[i+3] = 7;
    }
    ctx.putImageData(img, 0, 0);
  }
  renderVals() {
    return { noiseRef: this.noiseRef, fractalRef: this.fractalRef };
  }
}

</script>
